<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>贪吃蛇单机小游戏</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="panel intro" aria-labelledby="game-title">
        <p class="eyebrow">Classic Arcade</p>
        <h1 id="game-title">贪吃蛇</h1>
        <p class="description">
          吃掉发光的食物让蛇变长，避开墙壁和自己的身体。支持键盘方向键、WASD 与屏幕按钮操作。
        </p>
        <div class="score-board" aria-label="游戏分数">
          <div>
            <span>当前分数</span>
            <strong id="score">0</strong>
          </div>
          <div>
            <span>最高分</span>
            <strong id="best-score">0</strong>
          </div>
        </div>
        <div class="actions">
          <button id="start-button" type="button">开始游戏</button>
          <button id="pause-button" type="button" disabled>暂停</button>
        </div>
        <p id="status" class="status" role="status">点击“开始游戏”进入挑战。</p>
      </section>

      <section class="panel board-panel" aria-label="贪吃蛇游戏区域">
        <canvas id="game-canvas" width="600" height="600"></canvas>
        <div class="touch-controls" aria-label="屏幕方向控制">
          <button type="button" data-direction="up" aria-label="向上">▲</button>
          <button type="button" data-direction="left" aria-label="向左">◀</button>
          <button type="button" data-direction="down" aria-label="向下">▼</button>
          <button type="button" data-direction="right" aria-label="向右">▶</button>
        </div>
      </section>
    </main>

    <script src="snake.js"></script>
  </body>
</html>
